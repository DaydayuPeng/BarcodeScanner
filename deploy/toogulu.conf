# HTTP: serve ACME challenge for renewals, redirect everything else to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name toogoolu.szh5.cn _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/toogulu;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name toogoolu.szh5.cn _;
    root /var/www/toogulu;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/toogoolu/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/toogoolu/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        access_log off;
    }
}
