name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 必须单行空格分隔；多行会被当成一个错误包名
          packages: "tools platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List APK outputs
        if: always()
        run: |
          echo "=== apk tree ==="
          find android/app/build/outputs -type f -name '*.apk' -print || true
          ls -la android/app/build/outputs/apk/release || true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tugulu-scanner-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
