server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: tugulu-backend
  datasource:
    url: jdbc:mysql://localhost:3306/tugulu_warehouse?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  web:
    resources:
      static-locations: file:uploads/,classpath:/static/

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto


tugulu:
  jwt:
    secret: tugulu-warehouse-jwt-secret-key-2026-change-in-production-32bytes
    expire-hours: 24
  upload:
    dir: uploads
    base-url: /uploads/

logging:
  level:
    com.tugulu: info
